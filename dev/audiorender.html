    Dev-only page, not linked from the game. It makes NO sound: every scene of

      ?engine=new|old      which engine voice (default new)
      &scenes=a,b,c        which scenes (default all)
      &save=http://127.0.0.1:5393   POST the files to dev/audiorender-save.mjs
